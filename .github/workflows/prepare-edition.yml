name: Prepare verified edition

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full 40-character commit SHA with passing source CI
        type: string
        required: true
      edition_tag:
        description: Intended works/<slug>/vMAJOR.MINOR.PATCH tag
        type: string
        required: true
      publish:
        description: Explicitly publish an official edition after verification and environment approval
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: press-edition
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Require reviewed source check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, "scripts")
          from publish_edition import require_source_check
          commit = os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Expected full commit SHA")
          require_source_check(os.environ["GITHUB_REPOSITORY"], commit)
          PY
      - name: Build and verify canonical edition
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDITION_TAG: ${{ inputs.edition_tag }}
        run: |
          python scripts/build_edition.py --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" --output dist/edition
          python scripts/verify_edition.py dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-edition
          path: dist/edition/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: press-release
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-edition
          path: dist/edition/
      - name: Verify uploaded draft before optional publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDITION_TAG: ${{ inputs.edition_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python scripts/check_profile_history.py
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish); fi
          python scripts/publish_edition.py --directory dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" "${args[@]}"

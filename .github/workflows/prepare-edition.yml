name: Prepare verified edition

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full 40-character commit SHA with passing source CI
        type: string
        required: true
      edition_tag:
        description: Intended works/<slug>/vMAJOR.MINOR.PATCH tag
        type: string
        required: true
      publish:
        description: Promote an already reviewed draft from a successful staging run
        type: boolean
        default: false
      staged_run_id:
        description: Staging run ID (required for publication)
        type: string
      provenance_sha256:
        description: SHA-256 of the reviewed provenance.json (required for publication)
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: press-edition
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Require successful source and builder checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, "scripts")
          from publish_edition import require_source_check
          commit = os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Expected full commit SHA")
          for sha in dict.fromkeys([commit, os.environ["GITHUB_SHA"]]):
              require_source_check(os.environ["GITHUB_REPOSITORY"], sha)
          PY
      - name: Build and verify canonical edition
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDITION_TAG: ${{ inputs.edition_tag }}
        run: |
          python scripts/build_edition.py --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" --output dist/edition
          python scripts/verify_edition.py dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-edition
          path: dist/edition/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || (inputs.publish && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: press-release
    permissions:
      actions: read
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - if: ${{ !inputs.publish }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-edition
          path: dist/edition/
      - name: Retrieve previously reviewed edition
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
          PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
        run: python scripts/reviewed_artifact.py "$STAGED_RUN_ID" "$PROVENANCE_SHA256" dist/edition
      - name: Verify and stage or promote the edition
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDITION_TAG: ${{ inputs.edition_tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python scripts/check_profile_history.py --candidate dist/edition/provenance.json
          args=()
          if [ "$PUBLISH" = true ]; then args+=(--publish --issuer-commit "$GITHUB_SHA"); fi
          python scripts/publish_edition.py --directory dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" "${args[@]}"
      - name: Record draft for editorial review
        if: ${{ !inputs.publish }}
        run: |
          digest=$(sha256sum dist/edition/provenance.json | cut -d ' ' -f 1)
          printf 'Staging run ID: `%s`\n\nReviewed file: `provenance.json`\n\nSHA-256: `%s`\n' "$GITHUB_RUN_ID" "$digest" >> "$GITHUB_STEP_SUMMARY"

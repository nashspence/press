name: Validate sources

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Validate manuscript sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve existing versioned templates and stylesheets
        if: github.event.deleted != true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh scripts/check_profile_history.sh "$BASE_SHA" "$DEFAULT_BRANCH"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'

      - name: Install pinned validation dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check --no-deps --only-binary=:all: \
            -r requirements-ci.txt

      - name: Verify YAML validator version
        run: python -c 'import yaml; assert yaml.__version__ == "6.0.3"'

      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1

      - name: Verify compiler
        run: |
          test "$(pandoc --version | head -n 1)" = "pandoc 3.12.1"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.10.0'

      - name: Test public asset proxy
        run: node --test tests/test_worker.mjs

      - name: Run executable format tests
        run: python -m unittest discover -s tests -v

      - name: Enforce source format v1 and registrations on tracked tree
        run: python scripts/validate_sources.py

  assets:
    name: Verify manuscript assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Download, hash and inspect every referenced approved asset
        run: python scripts/verify_source_assets.py

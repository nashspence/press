name: Validate sources

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Validate manuscript sources
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install: false

      - name: Install the authoring toolchain
        run: make setup

      - name: Check profiles used by official editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/check_profile_history.py

      - name: Verify editorial history against the event base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && ( "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ) ]]; then
            BASE_SHA=$(git merge-base HEAD refs/remotes/origin/main)
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'A previous commit is required to validate editorial history.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          .venv/bin/python scripts/check_editorial_history.py --repo "$GITHUB_REPOSITORY" --base "$BASE_SHA"

      - name: Verify public edition records against receipts and notices
        run: .venv/bin/python scripts/public_record.py --check

      - name: Run executable tests
        run: make test

      - name: Enforce source format and registrations on the tracked tree
        run: make check-source

  assets:
    name: Verify manuscript assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Download, hash and inspect every referenced approved asset
        run: make check-assets PYTHON=python

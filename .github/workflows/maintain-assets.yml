name: Retire branches and clean assets

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview orphaned assets, sweep eligible versions, or retire a closed branch then sweep
        type: choice
        options: [preview, sweep, retire]
        default: preview
        required: true
      branch:
        description: Exact feature branch name (retire only; close or merge its PRs first)
        type: string
      head_sha:
        description: Full reviewed 40-character branch tip SHA (retire only)
        type: string
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: press-asset-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.PRESS_ASSET_MAINTENANCE_ENABLED == 'true')
    environment: press-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - name: Install pinned verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Create a repository-scoped branch-retirement token
        if: inputs.operation == 'retire'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PRESS_ASSET_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRESS_ASSET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Retire exact branch tip and collect eligible asset versions
        env:
          GH_TOKEN: ${{ github.token }}
          PRESS_ASSET_RETIRE_TOKEN: ${{ steps.app-token.outputs.token }}
          OPERATION: ${{ github.event_name == 'schedule' && 'sweep' || inputs.operation }}
          RETIRE_BRANCH: ${{ inputs.branch }}
          RETIRE_HEAD_SHA: ${{ inputs.head_sha }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_ID: ${{ vars.B2_BUCKET_ID }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
        run: |
          case "$OPERATION" in
            preview) python scripts/manage_assets.py gc ;;
            sweep) python scripts/manage_assets.py gc --apply ;;
            retire) python scripts/asset_workflow.py retire ;;
            *) echo 'Unsupported asset-maintenance operation.' >&2; exit 1 ;;
          esac

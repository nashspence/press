name: Retire branches and clean assets

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview orphaned assets, sweep during a coordinated pause, or retire a closed branch
        type: choice
        options: [preview, sweep, retire]
        default: preview
        required: true
      branch:
        description: Exact feature branch name (retire only; close or merge its PRs first)
        type: string
      head_sha:
        description: Full reviewed 40-character branch tip SHA (retire only)
        type: string
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: press-asset-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.PRESS_ASSET_MAINTENANCE_ENABLED == 'true')
    environment: press-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted main code only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: make setup
      - name: Create a repository-scoped branch-retirement token
        if: inputs.operation == 'retire'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PRESS_ASSET_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRESS_ASSET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Retire exact branch tip
        if: inputs.operation == 'retire'
        env:
          GH_TOKEN: ${{ github.token }}
          PRESS_ASSET_RETIRE_TOKEN: ${{ steps.app-token.outputs.token }}
          RETIRE_BRANCH: ${{ inputs.branch }}
          RETIRE_HEAD_SHA: ${{ inputs.head_sha }}
        run: mise exec -- .venv/bin/python -m guavajam_core.asset_workflow retire
      - name: Preview or sweep eligible asset versions
        if: inputs.operation != 'retire'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ github.event_name == 'schedule' && 'preview' || inputs.operation }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ADDRESSING_STYLE: ${{ vars.S3_ADDRESSING_STYLE }}
          S3_VERSIONING: ${{ vars.S3_VERSIONING }}
          S3_OBJECT_LOCK: ${{ vars.S3_OBJECT_LOCK }}
          S3_CONDITIONAL_WRITES: ${{ vars.S3_CONDITIONAL_WRITES }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
        run: |
          case "$OPERATION" in
            preview) mise exec -- .venv/bin/python -m guavajam_core.manage_assets gc ;;
            sweep) mise exec -- .venv/bin/python -m guavajam_core.manage_assets gc --apply ;;
            *) echo 'Unsupported asset-maintenance operation.' >&2; exit 1 ;;
          esac

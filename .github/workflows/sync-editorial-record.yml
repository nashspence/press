name: Synchronize editorial records

on:
  push:
    branches: [main]
    paths:
      - 'notices/**'
      - 'registrations/editions/**'
  workflow_dispatch:
    inputs:
      edition_tag:
        description: Edition whose public notes should match current main
        type: string
        required: true

permissions:
  contents: read

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.editions.outputs.tags }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: editions
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          EDITION_TAG: ${{ inputs.edition_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tags=$(python3 scripts/sync_editorial_record.py --select "$EDITION_TAG")
          else
            tags=$(git diff --name-only --no-renames -z "${BEFORE:?Missing push baseline}" "$GITHUB_SHA" -- notices registrations/editions | python3 scripts/sync_editorial_record.py --changed)
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  synchronize:
    needs: select
    if: needs.select.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.select.outputs.tags) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: press-notes-${{ matrix.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A queued job or retry must render all decisions already merged for this edition.
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Synchronize the verified edition and check the reader's addresses
        env:
          EDITION_TAG: ${{ matrix.tag }}
          GH_TOKEN: ${{ github.token }}
          RECORD_TARGET: ${{ vars.RECORD_TARGET }}
        run: python scripts/sync_editorial_record.py --sync "$EDITION_TAG"

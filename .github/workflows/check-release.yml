name: Check published editions

# Validation is advisory and happens AFTER a release is published.
# It does not publish releases or prevent a nonconforming release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag, metadata, and canonical artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_ASSETS_JSON: ${{ toJSON(github.event.release.assets) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          if os.environ.get("RELEASE_PRERELEASE") == "true":
              print("Prerelease: not an official edition; skipping check.")
              sys.exit(0)

          tag = os.environ.get("RELEASE_TAG", "")
          body = os.environ.get("RELEASE_BODY", "")
          assets = json.loads(os.environ.get("RELEASE_ASSETS_JSON", "[]"))
          asset_names = {asset.get("name") for asset in assets}
          errors = []

          tag_match = re.fullmatch(
              r"works/([a-z0-9]+(?:-[a-z0-9]+)*)/v([0-9]+\.[0-9]+\.[0-9]+)",
              tag,
          )
          if not tag_match:
              errors.append("Tag must be works/<slug>/vMAJOR.MINOR.PATCH.")

          def field(label):
              match = re.search(
                  rf"^{re.escape(label)}:\s*(.*?)\s*$",
                  body,
                  flags=re.MULTILINE,
              )
              return match.group(1).strip().strip("\x60") if match else ""

          work = field("Work")
          edition = field("Edition")
          canonical = field("Canonical artifact")
          rights = field("Rights")

          if not work:
              errors.append("Release notes must include Work: <title>.")
          if not rights:
              errors.append("Release notes must include Rights: <terms>.")
          if not edition:
              errors.append("Release notes must include Edition: vMAJOR.MINOR.PATCH.")
          if tag_match and edition != "v" + tag_match.group(2):
              errors.append("Edition must match the version in the tag.")
          if not canonical:
              errors.append("Release notes must include Canonical artifact: <filename>.")
          elif canonical not in asset_names:
              errors.append("The canonical artifact must be an uploaded release asset: " + canonical)

          if errors:
              for error in errors:
                  print("ERROR:", error, file=sys.stderr)
              sys.exit(1)

          print(f"Release metadata verified: {tag}; canonical asset: {canonical}")
          PY

name: Check published editions

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Verify the published edition
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_TARGET: ${{ vars.RECORD_TARGET }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: python scripts/audit_assets.py --release-id "$RELEASE_ID"

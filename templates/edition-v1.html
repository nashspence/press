<!DOCTYPE html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="press-presentation-profile" content="press.html.v1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>$pagetitle$ — $edition$</title>
<style id="press-edition-css">
@@PRESS_EDITION_CSS@@</style>
</head>
<body>
<main><article class="press-edition" data-press-profile="press.html.v1">
$body$
</article></main>
<footer>
<p>Cite this edition as $author$. <cite>$pagetitle$</cite>. Press, edition $edition$.</p>
<p>Official edition record and notices: <a id="press-edition-record" href="$record_url$">$record_url$</a><br>
Rights: $rights$<br>
$if(rights_statement)$Edition rights: <span data-press-field="rights">$rights_statement$</span><br>
$endif$Source commit: <code>$source_commit$</code></p>
</footer>
</body>
</html>
